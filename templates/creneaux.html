{{range .}}
<div>
    <span>{{.Heure}}</span>
    <input type="text" name="nom" placeholder="Votre nom" />
    <button hx-post="/reserver"
            hx-vals='{"heure": "{{.Heure}}", "date": "{{.Date}}"}'
            hx-include="[name='nom']"
            hx-target="#liste">
        Réserver
    </button>
</div>
{{end}}
